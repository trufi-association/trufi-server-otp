version: '3.8'

services:
  otp:
    build:
      context: ./Dockerfiles/${otpversion:-2.8.1}
      dockerfile: Dockerfile
    container_name: otp
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    ports:
      - "8080:8080"
    mem_limit: 2g
    environment:
      - JAVA_MAX_MEMORY=${JAVA_MAX_MEMORY:--Xmx2G}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/otp/"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

networks:
  default:
    name: trufi-server
